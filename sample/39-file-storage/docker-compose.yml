services:
  rustfs:
    image: rustfs/rustfs:1.0.1
    environment:
      # The app's credentials: AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    ports:
      # This machine only: the credentials above are RustFS's well-known defaults.
      - '127.0.0.1:9000:9000' # S3 API
      # Console. Not on 9001, which MQTT brokers often use (the repo's integration tests do).
      - '127.0.0.1:9101:9001'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/health']
      interval: 2s
      retries: 30
    restart: always

  # Creates the two buckets once RustFS is up, lets anyone read the photos (a CDN would
  # sit in front of that bucket in production), and exits. It runs on the RustFS image for
  # its curl, which signs the S3 requests itself.
  create-buckets:
    image: rustfs/rustfs:1.0.1
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        s3() { curl -fsS --aws-sigv4 aws:amz:us-east-1:s3 --user rustfsadmin:rustfsadmin "$$@"; }
        for bucket in store-photos store-private; do
          s3 --head -o /dev/null "http://rustfs:9000/$$bucket" 2>/dev/null || s3 -X PUT "http://rustfs:9000/$$bucket"
        done
        s3 -X PUT 'http://rustfs:9000/store-photos?policy' --data '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::store-photos/*"]}]}'
